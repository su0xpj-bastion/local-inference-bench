name: ci
on: [push, pull_request]
jobs:
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tests (healthy engine + every fault pinned)
        run: python -m pytest -v
      - name: healthy run, report to job summary
        run: python -m localbench run --target mock --out reports/healthy
      - name: faulted run must fail
        run: |
          if python -m localbench run --target mock --faults serialized,context_truncation --out reports/faulted; then
            echo "faulted run passed: a detector is broken"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
